name: Server CI

on:
  push:
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install, typecheck and test
        id: validation
        shell: bash
        run: |
          set +e
          : > ci-diagnostics.log

          echo "== npm ci ==" | tee -a ci-diagnostics.log
          npm ci 2>&1 | tee -a ci-diagnostics.log
          npm_status=${PIPESTATUS[0]}

          tsc_status=99
          test_status=99
          if [ "$npm_status" -eq 0 ]; then
            echo "" | tee -a ci-diagnostics.log
            echo "== TypeScript ==" | tee -a ci-diagnostics.log
            npx tsc -p tsconfig.json --noEmit 2>&1 | tee -a ci-diagnostics.log
            tsc_status=${PIPESTATUS[0]}
          fi

          if [ "$npm_status" -eq 0 ] && [ "$tsc_status" -eq 0 ]; then
            echo "" | tee -a ci-diagnostics.log
            echo "== Tests ==" | tee -a ci-diagnostics.log
            npm test 2>&1 | tee -a ci-diagnostics.log
            test_status=${PIPESTATUS[0]}
          fi

          echo "" | tee -a ci-diagnostics.log
          echo "npm_status=$npm_status" | tee -a ci-diagnostics.log
          echo "tsc_status=$tsc_status" | tee -a ci-diagnostics.log
          echo "test_status=$test_status" | tee -a ci-diagnostics.log

          if [ "$npm_status" -ne 0 ] || [ "$tsc_status" -ne 0 ] || [ "$test_status" -ne 0 ]; then
            exit 1
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-ci-diagnostics
          path: server/ci-diagnostics.log
          if-no-files-found: warn
          retention-days: 7
