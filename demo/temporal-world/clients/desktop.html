<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>FUMIRA — Temporal Clay World</title>
<link rel="stylesheet" href="/src/tokens.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #F7F5EF;
    overflow: hidden;
    font-family: 'SF Pro Rounded', -apple-system, system-ui, sans-serif;
    color: #202425;
    height: 100%;
    height: 100dvh;
    min-height: -webkit-fill-available;
  }
  #canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
  }

  /* Top bar */
  #top-bar {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 32px; z-index: 10;
    background: linear-gradient(to bottom, rgba(247,245,239,0.95) 0%, rgba(247,245,239,0) 100%);
    pointer-events: none;
  }
  #top-bar > * { pointer-events: all; }
  .brand { font-size: 14px; font-weight: 800; letter-spacing: 2px; color: #202425; }
  .brand span { color: #FF672A; }

  /* QR panel — toy compartment */
  #qr-panel {
    position: fixed; top: 16px; right: 24px;
    background-color: var(--fumira-warm-white);
    background-image: var(--fumira-clay-highlight);
    border-radius: 22px; padding: 18px 20px 16px;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.5),
      0 6px 0 var(--fumira-warm-white-rim),
      var(--fumira-shadow-large);
    border: 1px solid rgba(255,255,255,0.46);
    text-align: center; z-index: 20;
    transition: opacity 180ms ease, transform 180ms ease, border-color 180ms ease;
  }
  #qr-panel::before {
    content: '';
    position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
    width: 28px; height: 3px; border-radius: 2px;
    background: #C9C4B8;
  }
  #qr-panel.connected {
    border-color: #8FCB7E;
    box-shadow:
      inset 0 2px 6px rgba(0,0,0,0.12),
      inset 0 -1px 0 rgba(255,255,255,0.5),
      0 1px 0 rgba(255,255,255,0.6),
      0 0 0 1px rgba(143,203,126,0.2);
  }
  #qr-panel.waiting {
    border-color: #D5D0C5;
  }
  #qr-panel.hidden { opacity: 0; pointer-events: none; transform: translateY(-10px) scale(0.95); }
  #qr-code { margin: 8px 0; }
  #qr-code canvas { border-radius: 8px; }
  #qr-status {
    font-size: 10px; font-weight: 800; letter-spacing: 1.5px;
    text-transform: uppercase; margin-top: 10px;
  }
  #qr-status.waiting { color: #9E9688; }
  #qr-status.connected { color: #8FCB7E; }

  /* Session ID — recessed LED window */
  #session-id {
    font-size: 18px; font-weight: 900; letter-spacing: 3px;
    color: #F2EEE5; margin: 8px 0 6px;
    background: #202425;
    border-radius: 8px; padding: 6px 14px;
    box-shadow:
      inset 0 2px 4px rgba(0,0,0,0.4),
      inset 0 1px 1px rgba(0,0,0,0.3),
      0 1px 0 rgba(255,255,255,0.3);
    font-variant-numeric: tabular-nums;
    display: inline-block;
  }

  /* Time display — toy dial slot */
  #time-display {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background-color: var(--fumira-warm-white);
    background-image: var(--fumira-clay-highlight);
    border-radius: 22px; padding: 14px 28px;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.5),
      0 6px 0 var(--fumira-warm-white-rim),
      var(--fumira-shadow-large);
    border: 1px solid rgba(255,255,255,0.46);
    display: flex; align-items: center; gap: 18px; z-index: 10;
    min-width: 420px; justify-content: center;
  }
  #time-display .year-label {
    font-size: 24px; font-weight: 900; color: #4A90D9;
    font-variant-numeric: tabular-nums; min-width: 80px; text-align: center;
    background: #202425;
    border-radius: 8px; padding: 4px 14px;
    box-shadow:
      inset 0 2px 4px rgba(0,0,0,0.4),
      inset 0 1px 1px rgba(0,0,0,0.3),
      0 1px 0 rgba(255,255,255,0.3);
    letter-spacing: 2px;
  }
  #time-display .era-label {
    font-size: 10px; font-weight: 800; letter-spacing: 1.5px;
    text-transform: uppercase; color: #202425; opacity: 0.45;
  }

  /* Interval card — recessed label plate */
  #interval-card {
    position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
    background: #202425; color: #F2EEE5;
    border-radius: 10px; padding: 10px 22px;
    font-size: 11px; letter-spacing: 0.5px; font-weight: 600;
    opacity: 0; transition: opacity 0.3s ease;
    z-index: 10; text-align: center; max-width: 500px;
    box-shadow:
      inset 0 2px 4px rgba(0,0,0,0.5),
      0 1px 0 rgba(255,255,255,0.15);
  }
  #interval-card.visible { opacity: 1; }

  /* Status indicator — LED dot */
  #connection-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 8px;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.3);
  }
  #connection-dot.connected {
    background: #8FCB7E;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.2), 0 0 6px rgba(143,203,126,0.5);
  }
  #connection-dot.disconnected {
    background: #FF672A;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.2), 0 0 4px rgba(255,103,42,0.3);
  }
  #connection-dot.offline { background: #9E9688; box-shadow: inset 0 1px 2px rgba(0,0,0,0.3); }

  /* Loading */
  #loading {
    position: fixed; inset: 0; background: #F7F5EF;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 100; transition: opacity 0.6s ease;
  }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading h1 { font-size: 32px; font-weight: 900; letter-spacing: 3px; }
  #loading h1 span { color: #FF672A; }
  #loading p { font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; opacity: 0.4; margin-top: 8px; }

  /* Scene status overlay — toy indicator panel */
  #scene-status {
    position: fixed; bottom: 140px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center;
    z-index: 40; pointer-events: none;
    transition: opacity 0.5s ease;
  }
  #scene-status.hidden { opacity: 0; pointer-events: none; }
  #scene-status .status-pill {
    background-color: var(--fumira-warm-white); background-image: var(--fumira-clay-highlight); border-radius: 14px;
    padding: 10px 24px;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.46),
      0 4px 0 var(--fumira-warm-white-rim),
      var(--fumira-shadow-medium);
    border: 1px solid rgba(255,255,255,0.42);
    display: flex; align-items: center; gap: 10px;
  }
  #scene-status .pulse-dot {
    width: 8px; height: 8px; border-radius: 50%; background: #B7D83D;
    box-shadow: 0 0 6px rgba(183,216,61,0.5), inset 0 1px 2px rgba(0,0,0,0.2);
    animation: pulse 1.4s ease-in-out infinite;
  }
  #scene-status .status-dot-idle {
    width: 8px; height: 8px; border-radius: 50%; background: #CEC7B8;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.2);
  }
  #scene-status .status-text {
    font-size: 10px; font-weight: 800; letter-spacing: 1.5px;
    text-transform: uppercase; color: #202425; opacity: 0.45;
  }
  #scene-status.error .pulse-dot {
    background: #C9441D; animation: none;
    box-shadow: 0 0 6px rgba(201,68,29,0.4), inset 0 1px 2px rgba(0,0,0,0.2);
  }
  @keyframes pulse {
    0%, 100% { transform: scale(0.8); opacity: 0.4; }
    50% { transform: scale(1.3); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    #qr-panel, #scene-status { transition-duration: 1ms; }
    #scene-status .pulse-dot { animation: none; }
  }
</style>
</head>
<body>

<div id="loading">
  <h1>FUMIRA <span>TEMPORAL</span></h1>
  <p>Initializing temporal clay world</p>
</div>

<div id="top-bar">
  <div class="brand">FUMIRA <span>TEMPORAL</span></div>
  <div style="font-size:11px;letter-spacing:1px;opacity:0.4;">
    <span id="connection-dot" class="offline"></span>
    <span id="connection-label">STANDALONE</span>
  </div>
</div>

<div id="qr-panel" class="waiting">
  <div style="font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;opacity:0.4;margin-top:4px;">
    Scan to Control
  </div>
  <div id="session-id">------</div>
  <div id="qr-code"></div>
  <div id="qr-status" class="waiting">WAITING FOR PHONE</div>
</div>

<canvas id="canvas"></canvas>

<div id="scene-status">
  <div class="status-pill">
    <div class="status-dot-idle"></div>
    <div class="status-text" id="scene-status-text">Waiting for capture...</div>
  </div>
</div>

<div id="interval-card"></div>

<div id="time-display">
  <div style="text-align:right;">
    <div class="era-label" id="era-label">PRESENT</div>
    <div style="font-size:10px;opacity:0.3;letter-spacing:0.5px;font-weight:600;" id="interval-label">Current moment</div>
  </div>
  <div class="year-label" id="year-label">2026</div>
  <div style="font-size:10px;opacity:0.25;letter-spacing:0.5px;max-width:110px;font-weight:600;">
    Drag on phone<br>to travel time
  </div>
</div>

<script src="/vendor/qrcode.min.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "/vendor/three.module.min.js",
    "three/addons/": "/vendor/addons/"
  }
}
</script>

<script type="module" src="/desktop-app.js"></script>
</body>
</html>
