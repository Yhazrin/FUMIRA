name: FUMIRA
options:
  bundleIdPrefix: com.fumira
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  Pow:
    url: https://github.com/EmergeTools/Pow
    from: 1.0.6
targets:
  FUMIRA:
    type: application
    platform: iOS
    sources:
      - path: FUMIRA
        excludes:
          - Resources
      - path: FUMIRA/Resources
        excludes:
          - Info.plist
          - Fonts/**
        buildPhase: resources
      - path: FUMIRA/Resources/Fonts/CaveatBrush/CaveatBrush-Regular.ttf
        buildPhase: resources
      - path: FUMIRA/Resources/Fonts/LXGWMarkerGothic/LXGWMarkerGothic-Regular.ttf
        buildPhase: resources
      - path: FUMIRA-icon.icon
        buildPhase: resources
    info:
      path: FUMIRA/Resources/Info.plist
      properties:
        CFBundleDisplayName: FUMIRA
        UILaunchScreen:
          UIColorName: Paper
        NSCameraUsageDescription: 用于实时取景、拍照并生成过去与未来的场景。
        NSMicrophoneUsageDescription: 仅用于感知吹气强弱，让照片像纸片一样显影；声音不会被录制或保存。
        NSMotionUsageDescription: 用于让海报装饰随设备轻微倾斜；开启“减少动态效果”或低电量模式时会自动停用。
        NSBluetoothAlwaysUsageDescription: 用于连接 FutureCam 的实体快门与连续时间旋钮。
        NSPhotoLibraryUsageDescription: 用于导入一张照片体验时间相机。
        NSPhotoLibraryAddUsageDescription: 用于保存生成的时间海报。
        # Required on device to reach the Mac LAN relay (URLSession to a private IP).
        NSLocalNetworkUsageDescription: 用于在同一 Wi‑Fi 下连接电脑上的 FUMIRA 中转服务，以上传照片并生成时间影像。
        NSBonjourServices:
          - _http._tcp.
        CFBundleURLTypes:
          - CFBundleURLName: com.fumira.timecamera
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - fumira
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSSupportsLiveActivities: true
        UIAppFonts:
          - CaveatBrush-Regular.ttf
          - LXGWMarkerGothic-Regular.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Build-setting expanded. Debug defaults to local backend; Release stays empty = Mock.
        # Never put MINIMAX_API_KEY here — only the FUMIRA backend base URL.
        FUMIRA_API_BASE_URL: "$(FUMIRA_API_BASE_URL)"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # Debug relay runs on the developer Mac over private LAN HTTP.
          # Production must replace this with HTTPS before distribution.
          NSExceptionDomains:
            10.220.32.125:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fumira.timecamera
        PRODUCT_NAME: FUMIRA
        DEVELOPMENT_TEAM: 5CQ49A8XPZ
        ASSETCATALOG_COMPILER_APPICON_NAME: FUMIRA-icon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          # Current developer Mac relay. This works on both the simulator and
          # the paired iPhone; change it when the Mac's LAN address changes.
          FUMIRA_API_BASE_URL: "http://10.220.32.125:8787"
        Release:
          FUMIRA_API_BASE_URL: ""
    dependencies:
      - package: Pow
      - target: FUMIRALiveActivity
        embed: true
  FUMIRALiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: FUMIRALiveActivity
        excludes:
          - Info.plist
      - path: FUMIRA/Domain/CameraLiveActivityAttributes.swift
    info:
      path: FUMIRALiveActivity/Info.plist
      properties:
        CFBundleDisplayName: FUMIRA Camera
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fumira.timecamera.liveactivity
        PRODUCT_NAME: FUMIRALiveActivity
        DEVELOPMENT_TEAM: 5CQ49A8XPZ
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../../Frameworks"
  FUMIRATests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FUMIRATests
    dependencies:
      - target: FUMIRA
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fumira.timecamera.tests
        GENERATE_INFOPLIST_FILE: YES
  FUMIRAUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FUMIRAUITests
    dependencies:
      - target: FUMIRA
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fumira.timecamera.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FUMIRA:
    build:
      targets:
        FUMIRA: all
        FUMIRALiveActivity: all
        FUMIRATests: [test]
    test:
      gatherCoverageData: true
      targets:
        - name: FUMIRATests
        - name: FUMIRAUITests
