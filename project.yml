name: FUMIRA
options:
  bundleIdPrefix: com.fumira
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  FUMIRA:
    type: application
    platform: iOS
    sources:
      - path: FUMIRA
        excludes:
          - Resources
      - path: FUMIRA/Resources
        excludes:
          - Info.plist
          - Fonts/**/OFL.txt
        buildPhase: resources
    info:
      path: FUMIRA/Resources/Info.plist
      properties:
        CFBundleDisplayName: 时间相机
        UIAppFonts:
          - LXGWMarkerGothic-Regular.ttf
          - CaveatBrush-Regular.ttf
        UILaunchScreen:
          UIColorName: Paper
        NSCameraUsageDescription: 用于实时取景、拍照并生成过去与未来的场景。
        NSBluetoothAlwaysUsageDescription: 用于连接 FutureCam 的实体快门与连续时间旋钮。
        NSPhotoLibraryUsageDescription: 用于导入一张照片体验时间相机。
        NSPhotoLibraryAddUsageDescription: 用于保存生成的时间海报。
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fumira.timecamera
        PRODUCT_NAME: FUMIRA
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
  FUMIRATests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FUMIRATests
    dependencies:
      - target: FUMIRA
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fumira.timecamera.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FUMIRA:
    build:
      targets:
        FUMIRA: all
        FUMIRATests: [test]
    test:
      gatherCoverageData: true
      targets:
        - name: FUMIRATests
